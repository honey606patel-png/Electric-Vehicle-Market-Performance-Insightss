<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Industry Analytics Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        .dashboard-card { background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); padding: 20px; }

    <nav class="navbar navbar-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">⚡ Global EV Market Performance & Insights Portal</span>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="dashboard-card mb-4">
            <h4 class="text-secondary mb-3">Interactive Executive Dashboard & Storyboard</h4>
            <iframe src="{{ dashboard_url }}" allowfullscreen></iframe>
        </div>
    </div>

</html>
